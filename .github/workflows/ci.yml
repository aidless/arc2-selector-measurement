name: CI
on:
  push:
  pull_request:

jobs:
  offline-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Offline analysis tests
        run: python -m unittest discover -s tests -q
      - name: Syntax gate for importable modules
        run: python -m compileall -q analysis tests
